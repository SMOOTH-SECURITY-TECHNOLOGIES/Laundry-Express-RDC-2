    <title>Laundry Express RDC</title>
    <meta name="description" content="An on-demand laundry app for cities in the DRC, connecting customers with local laundromats for quick and easy laundry service, pickup, and delivery." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color for browsers (updated by theme.ts / ThemeContext) -->
    <meta name="theme-color" content="#0077B6" />

    <script>
      (function () {
        var pref = localStorage.getItem('themePreference');
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
          var legacy = localStorage.getItem('theme');
          pref = legacy === 'light' || legacy === 'dark' ? legacy : 'system';
        }
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#0077B6');
      })();
    </script>

    <!-- iOS PWA Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Laundry Express RDC",
      "description": "An on-demand laundry app for cities in the DRC, connecting customers with local laundromats for quick and easy laundry service, pickup, and delivery.",

  <body class="font-sans text-content-primary">
    <div id="root"></div>
    <script>
      // Initialize GTM dataLayer
      window.dataLayer = window.dataLayer || [];

      // --- Custom Domain & Subdomain Routing ---
      const hostname = window.location.hostname;
      const hostnameParts = hostname.split('.');
      const prodDomain = 'laundry.app'; // The actual production domain

      // 1. Check for Partner Subdomain (e.g., `prestige-pressing.laundry.app`)
      if (hostname.endsWith(prodDomain) && hostnameParts.length > 2 && hostnameParts[0] !== 'www') {
        window.customDomainPartnerSlug = hostnameParts[0];
      } else {
        // 2. Fallback to Full Custom Domain check
        const customDomainMap = {
          'pressing.prestige.com': 'PARTNER-1'
          // 'another-partner.com': 'PARTNER-X'
        };
        const partnerId = customDomainMap[hostname];
        if (partnerId) {
          window.customDomainPartnerId = partnerId;
        }
      }
    </script>
    <!-- 
      IMPORTANT NOTE FOR DEPLOYMENT:
      This application now uses browser history for routing (clean URLs like /profile).
      For this to work in production, your web server must be configured to handle Single Page Applications (SPAs).
      This means any request to a path that isn't a static file (like /profile, /order, etc.)
      should be redirected to serve this index.html file. The client-side router will then handle displaying the correct page.
      
      Example for Nginx:
      location / {
        try_files $uri $uri/ /index.html;
      }

      Hosting services like Vercel, Netlify, and Firebase Hosting usually handle this automatically or with a simple configuration rule.
    -->
