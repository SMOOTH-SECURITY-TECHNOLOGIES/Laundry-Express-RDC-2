name: Production Readiness Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      run_truth_e2e:
        description: Run live truth E2E corridors (requires Docker)
        type: boolean
        default: false

env:
  TRUTH_API_BASE_URL: http://localhost:18000/api/v1
  TRUTH_DATABASE_URL_SYNC: postgresql://laundry_user:laundry_pass@localhost:5434/laundry_express
  API_BASE_URL: http://localhost:18000/api/v1
  DATABASE_URL_SYNC: postgresql://laundry_user:laundry_pass@localhost:5434/laundry_express
  API_SMOKE_DATABASE_URL: postgresql://laundry_user:laundry_pass@localhost:5434/laundry_express

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies (alembic check)
        run: pip install -r apps/api/requirements.txt

      - name: Static production readiness
        run: node scripts/run_production_readiness_gate.mjs

  truth-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_truth_e2e == true
    runs-on: ubuntu-latest
    needs: static-gate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies for E2E scripts
        run: pip install -r apps/api/requirements.txt

      - name: Prepare local .env for Docker Compose
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-production-readiness-gate-secret/' .env
          cat >> .env <<'EOF'
          ADMIN_PASSWORD=ci-local-admin-password
          SEED_DEFAULT_PASSWORD=ci-local-default-password
          SEED_SUPER_ADMIN_PASSWORD=ci-local-admin-password
          SEED_PLATFORM_ADMIN_PASSWORD=ci-local-admin-password
          SEED_CUSTOMER_PASSWORD=ci-local-customer-password
          SEED_NEW_CUSTOMER_PASSWORD=ci-local-customer-password
          SEED_PARTNER_OWNER_PASSWORD=ci-local-partner-password
          SEED_PARTNER_STAFF_PASSWORD=ci-local-partner-password
          SEED_LOGISTICS_PASSWORD=ci-local-logistics-password
          SEED_LOGISTICS_2_PASSWORD=ci-local-logistics-password
          EOF

      - name: Build and start Docker stack
        run: docker compose up -d --build db redis api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18000/health; then
              echo "API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 5
          done
          docker compose logs api --tail 100
          exit 1

      - name: Full production readiness gate (truth E2E)
        env:
          TRUTH_RUN_E2E: '1'
        run: node scripts/run_production_readiness_gate.mjs

      - name: Driver operational corridor gate
        run: npm run test:driver-operational-corridor

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api --tail 200
